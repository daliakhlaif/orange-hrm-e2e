name: Trigger e2e cypress - Jenkins Job

on:
  push:

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Job
        run: |
          curl -X POST https://symbolic-penicillate-lean.ngrok-free.dev/job/orange-hrm-e2e/build \
            --user admin:${{ secrets.JENKINS_API_TOKEN }}
